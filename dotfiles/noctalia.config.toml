[accessibility]
ui_scale = 0.75

[bar]
density = "comfortable"
position = "top"

[bar.default]
center = ["clock", "date"]
end = [
    "media",
    "tray",
    "notifications",
    "clipboard",
    "network",
    "bluetooth",
    "volume",
    "brightness",
    "battery",
    "control-center",
    "settings",
    "session",
]
margin_ends = 0
padding = 13
position = "left"
radius = 0
scale = 0.8
shadow = false

[desktop_widgets]
enabled = false

[dock]
enabled = false

[lockscreen_widets]
enabled = false

[shell]
corner_radius_scale = 0.15
external_ip_enabled = true
font_family = "JetBrainsMono Nerd Font"
lang = "en"
panel_anchor_bar = "default"
popup_shadows = false
telemetry_enabled = false

[shell.animations]
enabled = false

[shell.shadow]
alpha = 0.0

[theme]
builtin = "Kanagawa"
shell_mode = "dark"

[widget.date]
anchor = true
format = "{:%Y %m %d}"
timezone = "America/New_York"
